<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ESS Camp">
<meta name="theme-color" content="#8fd3f5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>ESS Camp</title>
<script src="config.js"></script>
<style>
:root{--ink:#1b1b1b;--bg:#dfe9cf;--lime:#c9ec5a;--org:#ff9a5c;--pink:#ff9ecb;--lav:#a99bf5;--sky:#8fd3f5;--yel:#ffd23f;--grn:#3fbf6b;--red:#ff5a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif}
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0))}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.nb{border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);background:#fff}
.btn:active,.node:active,.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.hero{position:relative;height:210px;border-bottom:3px solid var(--ink);border-radius:0 0 30px 30px;overflow:hidden;padding:calc(14px + env(safe-area-inset-top,0)) 16px 0}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hi{position:relative;display:flex;justify-content:space-between;align-items:center}.hi h1{margin:0;font-size:26px;font-weight:900}.hi small{font-weight:700}
.avb{border:0;background:none;padding:0}
.chips{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:8px}
.chip{padding:6px 12px;border-radius:14px;font-weight:900;background:#fff;display:inline-block;margin:6px}.chips .chip{margin:0}
main{max-width:520px;margin:auto;padding:16px}
.ban{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:26px 0 14px}.ban span{font-size:32px}.ban small{display:block}.ban b{font-size:18px;font-weight:900}
.nd{display:flex;justify-content:center;margin:12px 0;position:relative}
.node{width:76px;height:76px;border-radius:50%;font-size:32px;display:grid;place-items:center;background:var(--c);padding:0;box-shadow:0 7px 0 var(--ink)}
.node.done{background:var(--grn);color:#fff}.node.lock{background:#cfd6c6;filter:grayscale(1)}
.node.cur{animation:pulse 1.4s infinite}
.go{position:absolute;top:-22px;background:var(--ink);color:#fff;font-style:normal;font-size:12px;font-weight:900;padding:3px 10px;border-radius:10px}
@keyframes pulse{50%{transform:scale(1.07)}}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;align-items:flex-end;justify-content:space-around;padding:8px 4px 6px;border-radius:28px;background:#fff7e6;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;border-radius:18px;font-size:11px;font-weight:900;color:var(--ink)}
nav button.on:not(.mid){background:#ffe0a8}
nav .mid{background:none;padding:0}.bw{position:relative;display:grid;place-items:center;width:68px;height:68px;margin-top:-34px}.bw .blob{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.bw svg+svg{position:relative}
nav .mid.on b{background:var(--ink);color:#fff;border-radius:8px;padding:0 8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.g3 .card{margin:0;text-align:center}.g3 h2{font-size:28px;margin:2px 0}
#ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0)) 16px calc(14px + env(safe-area-inset-bottom,0))}
#ov[hidden]{display:none}
.top{display:flex;gap:12px;align-items:center}.x{border:0;background:none;font-size:24px;font-weight:900}
.pb{flex:1;height:18px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}.pb i{display:block;height:100%;background:var(--grn);transition:width .3s}
.bd{flex:1;overflow:auto;padding:20px 0;max-width:520px;width:100%;margin:auto}.bd.c{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ft{max-width:520px;width:100%;margin:auto}
.say{display:flex;flex-direction:column;align-items:center;gap:14px}.bub{padding:16px;font-size:19px;line-height:1.5}
.big{width:100%;padding:16px;font-size:17px;font-weight:900}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-top:12px}.opt.r{background:#b9f0c9}.opt.w{background:#ffc9c3}
.fb{border:3px solid var(--ink);border-radius:20px;padding:14px;margin-top:10px}.fb.r{background:#b9f0c9}.fb.w{background:#ffc9c3}.fb p{margin:4px 0 10px}
.bounce{animation:b 1s infinite}@keyframes b{50%{transform:translateY(-12px) rotate(-4deg)}}
.card{padding:14px;margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center}
h2,h3{margin:8px 0;font-weight:900}
.wk{display:flex;justify-content:space-between;margin-top:10px}.wk div{text-align:center;font-size:12px}.wk b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:#fff;margin-top:4px}.wk .on b{background:var(--yel)}
.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.gr button{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:4px}.gr .sel{background:var(--lime);box-shadow:3px 3px 0 var(--ink)}
.inp{width:100%;padding:12px;margin:8px 0}
.pg{height:14px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin:4px 0 10px}.pg i{display:block;height:100%}
.seg{display:flex;gap:10px;margin-bottom:14px}.seg button{flex:1;padding:10px}.seg .on{background:var(--yel)}
.st{display:flex;gap:6px;margin-top:8px}.st button{flex:1;padding:8px 0;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:13px}
.st .ok.on{background:var(--grn)}.st .x.on{background:var(--red)}.st .na.on{background:#cfd6c6}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

let tab="path",L=null,shift="Pagi";
const hero=()=>`<div class="hero"><svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMax slice" stroke="${ink}" stroke-width="3" stroke-linejoin="round"><rect width="400" height="210" fill="#8fd3f5" stroke="none"/><circle cx="330" cy="50" r="22" fill="#ffd23f"/><path d="M0 150 Q80 100 170 140 T400 125 V210 H0Z" fill="#6fcf7a"/><path d="M0 185 Q120 145 240 178 T400 168 V210 H0Z" fill="#3fbf6b"/><path d="M55 172 L90 124 L125 172Z" fill="#ff9a5c"/><path d="M90 124 V172" fill="none"/><path d="M325 172 L348 118 L371 172Z" fill="#2f8f4e"/><path d="M292 174 L310 134 L328 174Z" fill="#2f8f4e"/></svg><div class="hi"><div><small>Selamat datang,</small><h1>Halo, ${esc(S.name||"RA")}!</h1></div><button class="avb" onclick="tab='me';render()">${av(S.av,56)}</button></div><div class="chips"><b class="nb chip">🔥 ${streak()}</b><b class="nb chip">⚡ ${S.xp}</b><b class="nb chip">❤ ${S.hearts}</b></div></div>`;
function path(){const cur=LS.findIndex(l=>!S.done[l.id]);let h=hero()+"<main>",last=-1;
 LS.forEach(l=>{if(l.ji!=last){last=l.ji;h+=`<div class="nb ban" style="background:${C[l.ji]}"><span>${J[l.ji].e}</span><div><small>Pos ${l.ji+1}</small><b>${J[l.ji].n}</b></div></div>`}
 const st=S.done[l.id]?"done":l.id==cur?"cur":"lock",off=Math.round(Math.sin(l.id*1.1)*56);
 h+=`<div class="nd" style="transform:translateX(${off}px)">${st=="cur"?'<i class="go">MULAI</i>':""}<button class="nb node ${st}" style="--c:${C[l.ji]}" ${st=="lock"?"disabled":""} onclick="start(${l.id})">${st=="done"?"★":st=="lock"?"🔒":av(FJ[l.ji],56)}</button></div>`});
 return h+(cur<0?`<div class="nb card" style="background:var(--yel)"><h2>🏆 Semua pos selesai!</h2>Ulangi pos mana saja untuk latihan.</div>`:"")+"</main>"}
function start(id){if(S.hearts<1){alert("Hati habis hari ini. Kembali besok ya!");return}L={l:LS[id],s:0,a:null,xp:0};lesson()}
function tutup(){L=null;$("#ov").hidden=true;render()}
function lesson(){const l=L.l,n=l.pts.length,tot=n+(l.i==l.k-1?1:0);if(L.s>=tot)return fin();
 let body,foot="";const q=Q[l.ji];
 if(L.s<n){const p=l.pts[L.s];S.paham[p[0]]=1;body=`<div class="say">${av(S.av,96)}<div class="nb bub">${p[1]}</div></div>`;foot=`<button class="nb btn big" style="background:var(--grn)" onclick="L.s++;lesson()">PAHAM, LANJUT</button>`}
 else{body=`<h3>${q.q}</h3>`+q.o.map((o,i)=>`<button class="nb opt ${L.a===null?"":i==q.a?"r":i==L.a?"w":""}" ${L.a===null?"":"disabled"} onclick="pick(${i})">${o}</button>`).join("");
  if(L.a!==null)foot=`<div class="fb ${L.a==q.a?"r":"w"}"><b>${L.a==q.a?"Mantap! 🎉":"Belum tepat"}</b><p>${q.w}</p><button class="nb btn big" onclick="L.s++;L.a=null;lesson()">LANJUT</button></div>`}
 $("#ov").hidden=false;$("#ov").innerHTML=`<div class="top"><button class="x" onclick="tutup()">✕</button><div class="pb"><i style="width:${L.s/tot*100}%"></i></div><b>❤ ${S.hearts}</b></div><div class="bd">${body}</div><div class="ft">${foot}</div>`}
function pick(i){const j=L.l.ji;L.a=i;if(i==Q[j].a){L.xp+=10;S.qok[j]=(S.qok[j]||0)+1}else{S.hearts=Math.max(0,S.hearts-1);S.miss[j]=(S.miss[j]||0)+1}save();lesson()}
function fin(){const l=L.l,pr=l.id<0,xp=pr?L.xp:S.done[l.id]?5:20+L.xp;S.xp+=xp;if(!pr)S.done[l.id]=1;if(!S.days.includes(today()))S.days.push(today());save();
 $("#ov").innerHTML=`<div class="bd c"><div class="bounce">${av(S.av,140)}</div><h2>${pr?"Latihan selesai!":`Pos ${l.ji+1} · ${l.i+1}/${l.k} selesai!`}</h2><div class="nb chip">⚡ +${xp} XP</div><div class="nb chip">🔥 ${streak()} hari beruntun</div></div><div class="ft"><button class="nb btn big" style="background:var(--yel)" onclick="tutup()">KEMBALI KE JALUR</button></div>`}
const avGrid=()=>`<div class="gr">${AV.map((a,i)=>`<button class="${i==S.av?"sel":""}" onclick="setAv(${i})">${av(i,52)}</button>`).join("")}</div>`;
function setAv(i){S.av=i;save();if(!$("#ov").hidden&&!L)onb();else render()}
function onb(){$("#ov").hidden=false;$("#ov").innerHTML=`<div class="bd c"><h2>Selamat datang di<br>ESS Camp ⛺</h2><p>Pilih karaktermu, lalu isi nama dan tokomu.</p>${avGrid()}<input class="nb inp" placeholder="Nama kamu" value="${esc(S.name)}" oninput="S.name=this.value"><input class="nb inp" placeholder="Nama toko (contoh: EIGER Semarang)" value="${esc(S.toko||"")}" oninput="S.toko=this.value"></div><div class="ft"><button class="nb btn big" style="background:var(--lime)" onclick="if(S.name.trim()&&(S.toko||'').trim()){S.name=S.name.trim();S.toko=S.toko.trim();save();$('#ov').hidden=true;render()}">MULAI PETUALANGAN</button></div>`}
function me(){const n=["M","S","S","R","K","J","S"],d=new Date();d.setDate(d.getDate()-6);let w="";
 for(let i=0;i<7;i++){w+=`<div class="${S.days.includes(day(d))?"on":""}">${n[d.getDay()]}<b>${S.days.includes(day(d))?"⚡":""}</b></div>`;d.setDate(d.getDate()+1)}
 const pr=J.map((j,i)=>{const t=LS.filter(l=>l.ji==i),k=t.filter(l=>S.done[l.id]).length;return `<div>${j.e} ${j.n}<div class="pg"><i style="width:${k/t.length*100}%;background:${C[i]}"></i></div></div>`}).join("");
 return `<main><div class="nb card" style="background:var(--yel)"><div class="row"><h2>Streak ${streak()} hari 🔥</h2><b>⚡ ${S.xp} XP</b></div><div class="wk">${w}</div></div><div class="nb card"><h3>Progres pos</h3>${pr}<small>${Object.keys(S.paham).length} dari ${ALL.length} poin sudah dipelajari</small></div><div class="nb card"><h3>Ganti karakter</h3>${avGrid()}<input class="nb inp" value="${esc(S.name)}" oninput="S.name=this.value;save()"><input class="nb inp" placeholder="Nama toko" value="${esc(S.toko||"")}" oninput="S.toko=this.value;save()"></div><div class="nb card"><b>Sinkron ke supervisor</b><br><small id="sst">${sst||"Belum dikirim"}</small><button class="nb btn big" style="background:var(--sky);margin-top:8px" onclick="sync();setTimeout(()=>{$('#sst').textContent=sst},1500)">Kirim data sekarang</button></div><button class="nb btn big" style="background:#fff" onclick="if(confirm('Hapus semua progres?')){localStorage.removeItem('ess2');location.reload()}">Reset progres</button></main>`}
function chk(){const k=today()+"|"+shift,D=S.log[k]||{};let ok=0,x=0;ALL.forEach(p=>{if(D[p.no]=="ok")ok++;if(D[p.no]=="x")x++});
 let h=`<main><div class="seg">${["Pagi","Siang"].map(s=>`<button class="nb btn ${s==shift?"on":""}" onclick="shift='${s}';render()">Shift ${s}</button>`).join("")}</div><div class="nb card" style="background:var(--lime)"><small>Skor shift (N/A tidak dihitung)</small><h2 style="font-size:34px;margin:0">${ok+x?Math.round(ok/(ok+x)*100)+"%":"–"}</h2>${ok} OK · ${x} terlewat</div>`;
 J.forEach((j,i)=>{h+=`<h3>${j.e} ${i+1}. ${j.n}</h3>`;ALL.filter(p=>p.j==i).forEach(p=>{const v=D[p.no];h+=`<div class="nb card"><div>${p.no}. ${p.t}</div><div class="st">${[["ok","OK"],["x","Terlewat"],["na","N/A"]].map(b=>`<button class="${b[0]} ${v==b[0]?"on":""}" onclick="lg(${p.no},'${b[0]}')">${b[1]}</button>`).join("")}</div></div>`})});
 return h+"</main>"}
function lg(n,v){const k=today()+"|"+shift;S.log[k]=S.log[k]||{};S.log[k][n]==v?delete S.log[k][n]:S.log[k][n]=v;save();const y=scrollY;render();scrollTo(0,y)}
const ic=(b)=>`<svg viewBox="0 0 40 40" width="30" height="30" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">${b}</svg>`;
const IC={dash:ic('<rect x="5" y="6" width="30" height="28" rx="6" fill="#8fd3f5"/><path d="M13 28V20M20 28V13M27 28V17" fill="none" stroke-width="4"/>'),
chk:ic('<rect x="8" y="7" width="24" height="29" rx="5" fill="#fff"/><rect x="14" y="3" width="12" height="7" rx="3" fill="#ffd23f"/><path d="M14 23L19 28L27 18" fill="none" stroke="#3fbf6b" stroke-width="4"/>'),
home:`<svg viewBox="0 0 40 40" width="36" height="36" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M4 34L20 6L36 34Z" fill="#ff9a5c"/><path d="M14 34L20 21L26 34Z" fill="#ffd23f"/></svg>`,
prac:ic('<circle cx="20" cy="20" r="15" fill="#fff"/><circle cx="20" cy="20" r="9" fill="#ff5a4f"/><circle cx="20" cy="20" r="3.5" fill="#fff"/>')};
const BLOB='<svg class="blob" viewBox="0 0 100 100"><path d="M50 5C62-2 76 6 76 18C90 14 100 28 92 40C102 50 98 66 86 70C88 84 74 96 62 90C56 100 44 100 38 90C26 96 12 84 14 70C2 66-2 50 8 40C0 28 10 14 24 18C24 6 38-2 50 5Z" fill="#c9ec5a" stroke="#1b1b1b" stroke-width="3"/></svg>';
function nav(){const it=[["dash","Dasbor"],["chk","Checklist"],["path","Jalur"],["prac","Latihan"],["me","Profil"]];
 $("nav").innerHTML=it.map(([t,l])=>t=="path"?`<button class="mid ${tab==t?"on":""}" data-t="${t}"><span class="bw">${BLOB}${IC.home}</span><b>${l}</b></button>`:`<button class="${tab==t?"on":""}" data-t="${t}">${t=="me"?av(S.av,30):IC[t]}<b>${l}</b></button>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.t=="prac")return prac();tab=b.dataset.t;scrollTo(0,0);render()})}
function prac(){if(S.hearts<1){alert("Hati habis hari ini. Kembali besok ya!");return}
 const sc=J.map((j,i)=>[i,(S.miss[i]||0)-(S.qok[i]||0)*.5+Math.random()]).sort((a,b)=>b[1]-a[1]);
 L={l:{ji:sc[0][0],i:0,k:1,pts:[],id:-1},s:0,a:null,xp:0};lesson()}
let rng=7;
function stats(r=rng){const d=new Date();d.setDate(d.getDate()-6);const lo=day(d),P={};ALL.forEach(p=>P[p.no]={ok:0,x:0});
 for(const k in S.log){if(r&&k.split("|")[0]<lo)continue;for(const n in S.log[k]){const v=S.log[k][n];if(P[n]&&(v=="ok"||v=="x"))P[n][v]++}}return P}
function dash(){const P=stats(),J2=J.map(()=>({ok:0,x:0}));let ok=0,x=0;
 ALL.forEach(p=>{ok+=P[p.no].ok;x+=P[p.no].x;J2[p.j].ok+=P[p.no].ok;J2[p.j].x+=P[p.no].x});
 const np=Object.keys(S.paham).length,mat=Math.round(np/ALL.length*100),cek=ok+x?Math.round(ok/(ok+x)*100):null,qo=sum(S.qok),qm=sum(S.miss),kz=qo+qm?Math.round(qo/(qo+qm)*100):null;
 const m=[mat,cek,kz].filter(v=>v!==null),tot=Math.round(m.reduce((a,b)=>a+b,0)/m.length),col=v=>v===null?"#cfd6c6":v<70?"#ff5a4f":v<90?"#ffd23f":"#3fbf6b",ar='d="M20 100A80 80 0 0 1 180 100" fill="none" pathLength="100"';
 let h=`<main><div class="row"><h2 style="font-size:26px">Dasbor ${esc(S.name||"RA")}</h2>${av(S.av,48)}</div><div class="seg">${[7,0].map(r=>`<button class="nb btn ${r==rng?"on":""}" onclick="rng=${r};render()">${r?"7 hari":"Semua"}</button>`).join("")}</div>
 <div class="nb card" style="background:var(--lav)"><svg viewBox="0 0 200 112" width="100%"><path ${ar} stroke="${ink}" stroke-width="32"/><path ${ar} stroke="#fff" stroke-width="24"/><path ${ar} stroke="${col(tot)}" stroke-width="24" stroke-dasharray="${tot} 100"/><text x="100" y="98" text-anchor="middle" font-size="32" font-weight="900" fill="${ink}" stroke="none">${tot}%</text></svg><div style="text-align:center">Skor kesiapan ESS</div></div>
 <div class="g3">${[["Materi",mat,"var(--lime)"],["Checklist",cek,"var(--sky)"],["Kuis",kz,"var(--pink)"]].map(a=>`<div class="nb card" style="background:${a[2]}"><small>${a[0]}</small><h2>${a[1]===null?"–":a[1]+"%"}</h2></div>`).join("")}</div>
 <h3>⚠️ Poin yang perlu diasah</h3>`;
 const wk=ALL.filter(p=>P[p.no].x>0).sort((a,b)=>P[b.no].x-P[a.no].x).slice(0,6);
 h+=wk.length?wk.map(p=>`<div class="nb card"><div class="row"><b>Poin ${p.no} · ${J[p.j].n}</b><span class="nb chip" style="background:var(--red);margin:0">${P[p.no].x}× terlewat</span></div><div style="margin:6px 0">${p.t}</div><button class="nb btn" style="padding:8px 12px;background:var(--yel)" onclick="start(${LS.findIndex(l=>l.pts.some(q=>q[0]==p.no))})">Latihan pos ini</button></div>`).join(""):`<div class="nb card">Belum ada poin terlewat. Isi checklist tiap shift supaya poin lemah muncul di sini.</div>`;
 h+=`<h3>Skor checklist per pos</h3><div class="nb card">`+J.map((j,i)=>{const a=J2[i],n=a.ok+a.x,sc=n?Math.round(a.ok/n*100):null;return `<div class="row"><span>${j.e} ${i+1}. ${j.n}</span><b>${sc===null?"–":sc+"%"}</b></div><div class="pg"><i style="width:${sc||0}%;background:${col(sc)}"></i></div>${S.miss[i]?`<small>Kuis salah ${S.miss[i]}×</small>`:""}`}).join("")+`</div><div class="nb card">📚 Belum dipelajari: <b>${ALL.length-np} poin</b><br><small>Data ini tersimpan di HP ini saja.</small></div></main>`;
 return h}
function render(){nav();app.innerHTML=({path,chk,me,dash}[tab])();if(!S.name||!(S.toko||"").trim())onb()}
render();sync();
</script>
</body>
</html>
